services:
  kuzu_ldbc_treebench:
    build:
      context: ..
      dockerfile: kuzu_ldbc/Dockerfile
    container_name: kuzu_ldbc_treebench
    volumes:
      - kuzu_ldbc_treebench_data:/kuzu_data
      - ../../:/project:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /kuzu_data/.initialized && test -f /kuzu_data/max_depths.json"]
      interval: 10s
      timeout: 5s
      retries: 60

volumes:
  kuzu_ldbc_treebench_data:
