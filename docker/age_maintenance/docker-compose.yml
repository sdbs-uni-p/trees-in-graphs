services:
  age_treebench_maintenance:
    build:
      context: ../age
      dockerfile: Dockerfile
    container_name: age_treebench_maintenance
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgresUser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgresPW}
      POSTGRES_DB: ${POSTGRES_DB:-postgresDB}
      PGDATA: /var/lib/postgresql/data/pgdata
      INIT_ROOT: /opt/age-init
      DATA_ROOT: /data/prepared
      DATA_PATHS: /data/prepared/artificial_forests/* /data/prepared/artificial_trees/*/* /data/prepared/snb/sf1
    command:
      - postgres
      - -c
      - shared_preload_libraries=age,pg_stat_statements,auto_explain,pg_hint_plan
    volumes:
      - age_treebench_maintenance_data:/var/lib/postgresql/data
      - ../../data:/data:ro
      - ../age/init:/opt/age-init:ro
      - ../../experiments/age_maintenance:/experiments:ro
      - ../../experiments/maintenance_parameters.csv:/config/maintenance_parameters.csv:ro
      - ../../queries/age_maintenance:/queries:ro
      - ../../results:/results:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/lib/postgresql/data/pgdata/.init_complete && pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  age_treebench_maintenance_data:
